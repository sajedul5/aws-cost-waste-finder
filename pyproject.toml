[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-cost-waste-finder"
version = "0.1.0"
description = "Read-only CLI that finds wasted AWS spend and estimates monthly savings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "moto[ec2]>=5.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
cwf = "cost_waste_finder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_waste_finder"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
